name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Plugin Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run validation script
        run: bash scripts/validate.sh

  check-bloat:
    name: Check for Bloat
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skill count
        run: |
          skill_count=$(ls skills/*/SKILL.md 2>/dev/null | wc -l)
          echo "Skill count: $skill_count"
          if [ "$skill_count" -gt 15 ]; then
            echo "ERROR: Too many skills ($skill_count). Consider merging related functionality."
            exit 1
          fi
          if [ "$skill_count" -gt 12 ]; then
            echo "WARNING: Skill count ($skill_count) is getting high. Review for consolidation opportunities."
          fi

      - name: Check for duplicate skill names
        run: |
          skill_names=$(grep -r "^name:" skills/*/SKILL.md 2>/dev/null | sed 's/.*: //')
          duplicates=$(echo "$skill_names" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "ERROR: Duplicate skill names found:"
            echo "$duplicates"
            exit 1
          fi
          echo "No duplicate skill names found."

      - name: Check context cost
        run: |
          # Gates what can enter a user's context, not repo bytes: scripts,
          # docs, and tests never load. Skill descriptions sit in the skill
          # listing every turn; a SKILL.md body loads when the skill runs.
          desc_chars=0
          for f in skills/*/SKILL.md; do
            n=$(awk '/^---/{c++; next} c==1 && /^description:/{sub(/^description: */,""); printf "%s", $0}' "$f" | wc -c)
            desc_chars=$((desc_chars + n))
          done
          body_bytes=$(cat skills/*/SKILL.md | wc -c)
          echo "Skill descriptions (every turn): $desc_chars chars"
          echo "Skill bodies (on invoke): $body_bytes bytes"
          # Baseline 2026-09-26: 1,530 chars, 111,203 bytes
          if [ "$desc_chars" -gt 2500 ]; then
            echo "ERROR: skill descriptions exceed 2,500 chars; they load every turn."
            exit 1
          fi
          if [ "$body_bytes" -gt 150000 ]; then
            echo "ERROR: SKILL.md bodies exceed 150KB. Move detail into scripts or merge skills."
            exit 1
          fi
          if [ "$desc_chars" -gt 2000 ] || [ "$body_bytes" -gt 130000 ]; then
            echo "WARNING: context cost is getting large."
          fi

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test Python scripts
        run: |
          for script in scripts/*.py; do
            echo "Testing: $script"
            python3 -m py_compile "$script"
          done

      - name: Test Bash scripts
        run: |
          for script in scripts/*.sh; do
            echo "Testing: $script"
            bash -n "$script"
          done

      - name: Test config initialization
        run: |
          python3 scripts/init-config.py --init
          python3 scripts/init-config.py --get thresholds.token_warning
          python3 scripts/init-config.py --dump > /dev/null

      - name: Run context ledger tests
        run: python3 scripts/test-context-ledger.py

      - name: Run snapshot reminder tests
        run: python3 scripts/test-check-snapshot-age.py

      - name: Run instruction lint tests
        run: |
          python3 scripts/test-instruction-files.py
          python3 scripts/test-instruction-lint.py

      - name: Run delegation cost tests
        run: python3 scripts/test-delegation-cost.py
